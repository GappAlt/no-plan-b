<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Flash Game on GitHub Pages</title>
</head>
<body>

    <!-- 1. The container where the Flash player will load -->
    <div id="flash-container"></div>

    <!-- 2. Load the main Ruffle script -->
    <script src="ruffle.js"></script>

    <!-- 3. Initialize and play the SWF file -->
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            // Access the Ruffle object initialized by ruffle.js
            const ruffle = window.RufflePlayer.newest();
            
            // Create a player instance
            const player = ruffle.createPlayer();
            
            // Find your container element and attach the player to it
            const container = document.getElementById("flash-container");
            container.appendChild(player);
            
            // Load your specific SWF file with custom configuration
            player.load({
                url: "games/meatboy/meatboy.swf",
                allowScriptAccess: true
            });

            // Optional: style the player dimensions
            player.style.width = "800px";
            player.style.height = "600px";
        });
    </script>

</body>
</html>
